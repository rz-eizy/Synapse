# Datos de identificación del proyecto
spring.application.name=backend-synapse
server.port=8080
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Driver y Dialecto (POSTGRESQL)
spring.datasource.driver-class-name=org.postgresql.Driver

# Deshabilitar el modo "open-in-view" para evitar problemas de LazyInitializationException
spring.jpa.open-in-view=false


gcp.credentials.path=${GCP_CREDENTIALS_FILE}

# SafeSearch — umbrales de moderación automática
safesearch.approve-below=POSSIBLE
safesearch.reject-from=LIKELY

# Async executor — pool dedicado al análisis de imágenes
safesearch.async.core-pool-size=2
safesearch.async.max-pool-size=5
safesearch.async.queue-capacity=50

openai.api.key=${SPRING_AI_MISTRAL_API_KEY}
spring.ai.mistralai.moderation.model=mistral-moderation-latest