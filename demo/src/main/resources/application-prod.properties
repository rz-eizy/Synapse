# Valida si la base de datos concuerda con lo que esta codificado.
spring.jpa.hibernate.ddl-auto=validate

# Utiliza variables de entorno si están disponibles, de lo contrario, usa valores locales
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

security.jwt.secret-key=${JWT_SECRET_KEY}
security.jwt.algorithm=${JWT_ALGORITHM}
security.jwt.expiration=${JWT_EXPIRATION}
security.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION}

# Cloudflare R2 / AWS S3 Config
cloudflare.r2.endpoint=${CLOUDFLARE_ACOUNT}
cloudflare.r2.access-key=${CLOUDFLARE_ACCESS_KEY}
cloudflare.r2.secret-key=${CLOUDFLARE_SECRET_KEY}
cloudflare.r2.bucket-name=${CLOUDFLARE_BUCKET_NAME}
cloudflare.r2.public-url=${CLOUDFLARE_PUBLIC_ID}

# Tamaño máximo permitido para un solo archivo (ejemplo: 10 Megabytes)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB